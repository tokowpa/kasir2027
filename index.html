<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir Realtime Firebase - Ecer & Karton</title>
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
    }

    header {
      background: var(--surface);
      padding: 12px 16px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .brand {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 99px;
      background: #f1f5f9;
      font-weight: 700;
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      padding: 4px;
      border-radius: 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .container {
      max-width: 840px;
      margin: 14px auto;
      padding: 0 12px;
    }

    .card {
      background: var(--surface);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }

    .checkout-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #fff;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .total-box label, .pay-box label {
      font-size: 0.75rem;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }

    .total-amount {
      font-size: 1.65rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .change-amount {
      font-size: 0.9rem;
      margin-top: 4px;
      font-weight: 600;
      color: #4ade80;
    }

    .pay-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      text-align: right;
    }

    .pay-input:focus {
      outline: 2px solid #38bdf8;
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      grid-column: span 2;
    }

    .edit-banner {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      transition: border 0.2s;
      background: #fff;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
    }

    label.field-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .btn {
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: #f1f5f9; color: var(--text); }
    .btn-sm { padding: 6px 10px; font-size: 0.78rem; border-radius: 7px; }

    .search-wrapper {
      position: relative;
    }

    .search-results {
      position: absolute;
      top: 105%;
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      max-height: 260px;
      overflow-y: auto;
      z-index: 50;
      display: none;
    }

    .search-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      gap: 8px;
    }

    .search-item:hover {
      background: #f8fafc;
    }

    .cart-item {
      display: flex;
      flex-direction: column;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .cart-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .cart-title {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .cart-note {
      font-size: 0.76rem;
      color: var(--muted);
      font-style: italic;
    }

    .cart-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Tombol Pilihan Eceran / Kartonan */
    .unit-toggle {
      display: inline-flex;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 8px;
      gap: 3px;
    }

    .unit-btn {
      border: none;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
    }

    .unit-btn.active-ecer {
      background: var(--primary);
      color: #fff;
    }

    .unit-btn.active-karton {
      background: var(--warning);
      color: #fff;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-weight: 800;
      cursor: pointer;
    }

    .product-row, .trx-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .badge-tag {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 6px;
      background: #e2e8f0;
      color: #334155;
      font-weight: 600;
      margin-top: 3px;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      z-index: 999;
      display: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>KASIR REALTIME</span>
      <span id="syncStatus" class="status-badge">Menghubungkan...</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('kasir')">Kasir</button>
      <button class="tab-btn" onclick="switchTab('produk')">Kelola Produk</button>
      <button class="tab-btn" onclick="switchTab('riwayat')">Riwayat</button>
      <button class="tab-btn" onclick="switchTab('pengaturan')">Pengaturan</button>
    </div>
  </header>

  <div class="container">
    <!-- ================= TAB 1: KASIR ================= -->
    <div id="tab-kasir">
      <div id="editTrxBanner" class="edit-banner hidden">
        <span>✏️ Sedang mengedit transaksi #<strong id="editingTrxCode"></strong></span>
        <button class="btn btn-outline btn-sm" onclick="cancelEditTransaction()">Batal Edit</button>
      </div>

      <div class="checkout-top">
        <div class="total-box">
          <label>TOTAL BELANJA</label>
          <div class="total-amount" id="displayTotal">Rp 0</div>
          <div class="change-amount" id="displayChange">Kembalian: Rp 0</div>
        </div>
        <div class="pay-box">
          <label>UANG PEMBELI (Rp)</label>
          <input type="text" id="inputBayar" class="pay-input" inputmode="numeric" placeholder="0">
        </div>
        <div class="action-row">
          <button class="btn btn-danger" style="flex:1" onclick="clearCart()">Reset</button>
          <button class="btn btn-success" style="flex:2" onclick="prosesBayar(false)">Simpan</button>
          <button class="btn btn-primary" style="flex:2" onclick="prosesBayar(true)">Cetak RawBT</button>
        </div>
      </div>

      <div class="card">
        <div class="search-wrapper">
          <input type="text" id="searchInput" placeholder="Scan barcode / ketik nama / catatan produk..." autocomplete="off" autofocus>
          <div id="searchResults" class="search-results"></div>
        </div>
      </div>

      <div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <strong>Keranjang Belanja (<span id="cartCount">0</span>)</strong>
          <small style="color:var(--muted)">🛒 Eceran | 📦 Kartonan</small>
        </div>
        <div id="cartList">
          <p style="text-align:center; color:var(--muted); padding:20px 0;">Keranjang masih kosong</p>
        </div>
      </div>
    </div>

    <!-- ================= TAB 2: KELOLA PRODUK ================= -->
    <div id="tab-produk" class="hidden">
      <div class="card">
        <h3 style="margin-bottom:10px; font-size:1rem;">Tambah / Ubah Produk</h3>
        <form id="productForm" style="display:grid; gap:10px;">
          <input type="hidden" id="prodDocId">

          <div>
            <label class="field-label">Nama Produk (Wajib)</label>
            <input type="text" id="prodName" placeholder="Contoh: Indomie Goreng" required>
          </div>

          <div>
            <label class="field-label">Kode Barcode (Opsional - Bisa Banyak, Pisahkan Koma / Enter)</label>
            <textarea id="prodBarcodes" rows="2" placeholder="Kosongkan jika tidak ada barcode. Contoh: 8992761136014, 8992761999991"></textarea>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
            <div>
              <label class="field-label">🛒 Harga Eceran (Wajib)</label>
              <input type="text" id="prodPriceEcer" inputmode="numeric" placeholder="0" required>
            </div>
            <div>
              <label class="field-label">📦 Harga Kartonan</label>
              <input type="text" id="prodPriceKarton" inputmode="numeric" placeholder="Opsional">
            </div>
            <div>
              <label class="field-label">💰 Harga Beli</label>
              <input type="text" id="prodBuyPrice" inputmode="numeric" placeholder="Opsional">
            </div>
          </div>

          <div>
            <label class="field-label">Catatan Produk (Opsional)</label>
            <input type="text" id="prodNote" placeholder="Contoh: 1 karton isi 40 pcs / rentengan">
          </div>

          <div style="display:flex; gap:8px;">
            <button type="submit" class="btn btn-primary" style="flex:1">Simpan & Sinkronkan Realtime</button>
            <button type="button" class="btn btn-outline" onclick="resetProductForm()">Bersihkan</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;">
          <strong>Daftar Produk (<span id="totalProdCount">0</span>)</strong>
          <input type="text" id="filterProdInput" placeholder="Cari nama / barcode / catatan..." style="max-width:240px; padding:6px 10px;">
        </div>
        <div id="productList"></div>
      </div>
    </div>

    <!-- ================= TAB 3: RIWAYAT TRANSAKSI ================= -->
    <div id="tab-riwayat" class="hidden">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <strong>Riwayat Transaksi (<span id="totalTrxCount">0</span>)</strong>
          <small style="color:var(--muted)">Klik Edit untuk muat ulang ke keranjang</small>
        </div>
        <div id="transactionList"></div>
      </div>
    </div>

    <!-- ================= TAB 4: PENGATURAN ================= -->
    <div id="tab-pengaturan" class="hidden">
      <div class="card" style="display:grid; gap:10px;">
        <h3 style="font-size:1rem;">Identitas Toko & Struk</h3>
        <input type="text" id="storeNameInput" placeholder="Nama Toko (Untuk Struk)">
        <input type="text" id="storeAddrInput" placeholder="Alamat / No HP Toko">
        <button class="btn btn-primary" onclick="saveStoreSettings()">Simpan Pengaturan</button>
        <hr style="border:none; border-top:1px solid var(--border); margin:6px 0;">
        <button class="btn btn-outline" onclick="forceFullResync()">Sinkron Ulang Semua Data dari Cloud</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- ================= SCRIPT FIREBASE & LOGIKA KASIR ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, where 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // =========================================================================
    // 1. GANTI KONFIGURASI FIREBASE ANDA DI SINI
    // =========================================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCiDlnl6AiHWsbJOpG0MHc8sTCn_MebTqI",
  authDomain: "wpastore-1d2c3.firebaseapp.com",
  databaseURL: "https://wpastore-1d2c3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "wpastore-1d2c3",
  storageBucket: "wpastore-1d2c3.firebasestorage.app",
  messagingSenderId: "752685099267",
  appId: "1:752685099267:web:8c516725cdd0885739a136"
};

    const app = initializeApp(firebaseConfig);
    const dbCloud = getFirestore(app);

    // =========================================================================
    // 2. DATABASE LOKAL INDEXEDDB (DEXIE) - TANPA STOK
    // =========================================================================
    const dbLocal = new Dexie("KasirRealtimeV2DB");
    dbLocal.version(1).stores({
      products: "id, name, *barcodes, priceEcer, priceKarton, buyPrice, note, updatedAt",
      transactions: "id, code, total, paid, change, createdAt, updatedAt"
    });

    let cart = [];
    let editingTrxId = null;
    let searchTimeout = null;
    let unsubProducts = null;
    let unsubTransactions = null;

    const formatRibuan = (num) => Number(num || 0).toLocaleString("id-ID");
    const parseRibuan = (str) => Number(String(str || "").replace(/\D/g, "")) || 0;

    function parseBarcodeList(rawText) {
      if (!rawText) return [];
      return [...new Set(
        String(rawText)
          .split(/[\n,]+/)
          .map(b => b.trim())
          .filter(Boolean)
      )];
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.style.display = "block";
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.display = "none"; }, 3000);
    }

    // =========================================================================
    // 3. SINKRONISASI REALTIME PRODUK & TRANSAKSI
    // =========================================================================
    function startRealtimeSync() {
      if (unsubProducts) unsubProducts();
      if (unsubTransactions) unsubTransactions();

      const lastProdSync = Number(localStorage.getItem("lastProdSync")) || 0;
      const qProd = query(collection(dbCloud, "products"), where("updatedAt", ">", lastProdSync));

      unsubProducts = onSnapshot(qProd, async (snapshot) => {
        setSyncStatus(true);
        let maxTime = lastProdSync;
        const itemsToPut = [];

        snapshot.docChanges().forEach((change) => {
          const data = change.doc.data();
          const item = {
            id: change.doc.id,
            name: data.name || "",
            barcodes: Array.isArray(data.barcodes) ? data.barcodes : [],
            priceEcer: Number(data.priceEcer || 0),
            priceKarton: Number(data.priceKarton || 0),
            buyPrice: Number(data.buyPrice || 0),
            note: data.note || "",
            updatedAt: Number(data.updatedAt || Date.now())
          };

          if (change.type === "added" || change.type === "modified") {
            itemsToPut.push(item);
            if (item.updatedAt > maxTime) maxTime = item.updatedAt;

            // Update harga produk di keranjang aktif jika harga Ecer / Karton berubah
            cart.forEach(c => {
              if (c.productId === item.id) {
                c.name = item.name;
                c.note = item.note;
                c.priceEcer = item.priceEcer;
                c.priceKarton = item.priceKarton;
                c.price = getEffectivePrice(item, c.unitType);
              }
            });
          }

          if (change.type === "removed") {
            dbLocal.products.delete(change.doc.id);
          }
        });

        if (itemsToPut.length > 0) {
          await dbLocal.products.bulkPut(itemsToPut);
          localStorage.setItem("lastProdSync", maxTime);
          renderCart();
          renderProductList();
          if (lastProdSync > 0) showToast(`${itemsToPut.length} produk tersinkronisasi!`);
        }
      }, () => setSyncStatus(false));

      const lastTrxSync = Number(localStorage.getItem("lastTrxSync")) || 0;
      const qTrx = query(collection(dbCloud, "transactions"), where("updatedAt", ">", lastTrxSync));

      unsubTransactions = onSnapshot(qTrx, async (snapshot) => {
        setSyncStatus(true);
        let maxTrxTime = lastTrxSync;
        const trxToPut = [];

        snapshot.docChanges().forEach((change) => {
          const data = change.doc.data();
          const trx = { id: change.doc.id, ...data };
          if (change.type === "added" || change.type === "modified") {
            trxToPut.push(trx);
            if ((trx.updatedAt || 0) > maxTrxTime) maxTrxTime = trx.updatedAt;
          }
          if (change.type === "removed") {
            dbLocal.transactions.delete(change.doc.id);
          }
        });

        if (trxToPut.length > 0) {
          await dbLocal.transactions.bulkPut(trxToPut);
          localStorage.setItem("lastTrxSync", maxTrxTime);
          renderTransactions();
        }
      }, () => setSyncStatus(false));
    }

    function setSyncStatus(online) {
      const el = document.getElementById("syncStatus");
      if (online) {
        el.innerText = "🟢 Realtime Aktif";
        el.style.background = "#dcfce7";
        el.style.color = "#166534";
      } else {
        el.innerText = "🟠 Offline (Lokal)";
        el.style.background = "#fef3c7";
        el.style.color = "#92400e";
      }
    }

    // =========================================================================
    // 4. LOGIKA KERANJANG, ECERAN & KARTONAN
    // =========================================================================
    function getEffectivePrice(product, unitType) {
      if (unitType === "karton" && Number(product.priceKarton) > 0) {
        return Number(product.priceKarton);
      }
      return Number(product.priceEcer || 0);
    }

    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");

    searchInput.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const code = searchInput.value.trim();
        if (!code) return;

        // Cari berdasarkan multi-barcode terlebih dahulu
        const exact = await dbLocal.products.where("barcodes").equals(code).first();
        if (exact) {
          addToCart(exact, "ecer");
          searchInput.value = "";
          searchResults.style.display = "none";
        } else {
          showToast("Barcode tidak ditemukan!");
        }
      }
    });

    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimeout);
      const kw = searchInput.value.trim().toLowerCase();
      if (!kw) {
        searchResults.style.display = "none";
        return;
      }

      searchTimeout = setTimeout(async () => {
        const matches = await dbLocal.products
          .filter(p =>
            p.name.toLowerCase().includes(kw) ||
            (p.note && p.note.toLowerCase().includes(kw)) ||
            (Array.isArray(p.barcodes) && p.barcodes.some(b => b.toLowerCase().includes(kw)))
          )
          .limit(15)
          .toArray();

        if (matches.length === 0) {
          searchResults.innerHTML = `<div class="search-item" style="color:var(--muted)">Produk tidak ditemukan</div>`;
        } else {
          searchResults.innerHTML = matches.map(p => `
            <div class="search-item" onclick="selectProduct('${p.id}')">
              <div>
                <strong>${p.name}</strong>
                ${p.note ? `<span class="badge-tag">${p.note}</span>` : ""}<br>
                <small style="color:var(--muted)">
                  🛒 Ecer: Rp ${formatRibuan(p.priceEcer)}
                  ${p.priceKarton > 0 ? `| 📦 Karton: Rp ${formatRibuan(p.priceKarton)}` : ""}
                </small>
              </div>
              <strong style="color:var(--primary)">Rp ${formatRibuan(p.priceEcer)}</strong>
            </div>
          `).join("");
        }
        searchResults.style.display = "block";
      }, 150);
    });

    window.selectProduct = async (id) => {
      const prod = await dbLocal.products.get(id);
      if (prod) {
        addToCart(prod, "ecer");
        searchInput.value = "";
        searchResults.style.display = "none";
        searchInput.focus();
      }
    };

    function addToCart(product, unitType = "ecer") {
      const price = getEffectivePrice(product, unitType);
      const existing = cart.find(item => item.productId === product.id && item.unitType === unitType);

      if (existing) {
        existing.qty += 1;
        existing.price = price;
        existing.priceEcer = Number(product.priceEcer || 0);
        existing.priceKarton = Number(product.priceKarton || 0);
      } else {
        cart.unshift({
          uid: product.id + "_" + unitType + "_" + Date.now(),
          productId: product.id,
          name: product.name,
          note: product.note || "",
          unitType,
          price,
          priceEcer: Number(product.priceEcer || 0),
          priceKarton: Number(product.priceKarton || 0),
          qty: 1
        });
      }
      renderCart();
    }

    window.setCartUnit = async (uid, newUnit) => {
      const item = cart.find(i => i.uid === uid);
      if (!item) return;

      const freshProd = await dbLocal.products.get(item.productId);
      const priceEcer = freshProd ? Number(freshProd.priceEcer || 0) : item.priceEcer;
      const priceKarton = freshProd ? Number(freshProd.priceKarton || 0) : item.priceKarton;

      if (newUnit === "karton" && priceKarton <= 0) {
        return showToast("Harga kartonan belum diatur untuk produk ini!");
      }

      item.unitType = newUnit;
      item.priceEcer = priceEcer;
      item.priceKarton = priceKarton;
      item.price = newUnit === "karton" ? priceKarton : priceEcer;
      renderCart();
    };

    window.updateQty = (uid, delta) => {
      const idx = cart.findIndex(i => i.uid === uid);
      if (idx === -1) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      renderCart();
    };

    window.clearCart = () => {
      cart = [];
      editingTrxId = null;
      document.getElementById("editTrxBanner").classList.add("hidden");
      document.getElementById("inputBayar").value = "";
      renderCart();
      searchInput.focus();
    };

    window.cancelEditTransaction = () => {
      clearCart();
      showToast("Edit transaksi dibatalkan");
    };

    function getCartTotal() {
      return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    }

    function renderCart() {
      const listEl = document.getElementById("cartList");
      const total = getCartTotal();
      document.getElementById("displayTotal").innerText = "Rp " + formatRibuan(total);
      document.getElementById("cartCount").innerText = cart.reduce((s, i) => s + i.qty, 0);

      if (cart.length === 0) {
        listEl.innerHTML = `<p style="text-align:center; color:var(--muted); padding:20px 0;">Keranjang masih kosong</p>`;
      } else {
        listEl.innerHTML = cart.map(item => {
          const isKarton = item.unitType === "karton";
          return `
            <div class="cart-item">
              <div class="cart-top">
                <div>
                  <div class="cart-title">${item.name}</div>
                  ${item.note ? `<div class="cart-note">Catatan: ${item.note}</div>` : ""}
                </div>
                <strong>Rp ${formatRibuan(item.price * item.qty)}</strong>
              </div>
              <div class="cart-bottom">
                <div class="unit-toggle">
                  <button class="unit-btn ${!isKarton ? "active-ecer" : ""}" onclick="setCartUnit('${item.uid}', 'ecer')">
                    🛒 Ecer (${formatRibuan(item.priceEcer)})
                  </button>
                  <button class="unit-btn ${isKarton ? "active-karton" : ""}" onclick="setCartUnit('${item.uid}', 'karton')">
                    📦 Karton ${item.priceKarton > 0 ? `(${formatRibuan(item.priceKarton)})` : "(Kosong)"}
                  </button>
                </div>
                <div class="qty-controls">
                  <button class="qty-btn" onclick="updateQty('${item.uid}', -1)">-</button>
                  <strong style="min-width:22px; text-align:center;">${item.qty}</strong>
                  <button class="qty-btn" onclick="updateQty('${item.uid}', 1)">+</button>
                </div>
              </div>
            </div>
          `;
        }).join("");
      }
      hitungKembalian();
    }

    const inputBayar = document.getElementById("inputBayar");
    inputBayar.addEventListener("input", () => {
      const raw = parseRibuan(inputBayar.value);
      inputBayar.value = raw > 0 ? formatRibuan(raw) : "";
      hitungKembalian();
    });

    function hitungKembalian() {
      const total = getCartTotal();
      const bayar = parseRibuan(inputBayar.value);
      const kembali = bayar - total;
      const el = document.getElementById("displayChange");
      if (bayar === 0) {
        el.innerText = "Kembalian: Rp 0";
        el.style.color = "#4ade80";
      } else if (kembali < 0) {
        el.innerText = "Kurang: Rp " + formatRibuan(Math.abs(kembali));
        el.style.color = "#f87171";
      } else {
        el.innerText = "Kembalian: Rp " + formatRibuan(kembali);
        el.style.color = "#4ade80";
      }
    }

    // =========================================================================
    // 5. SIMPAN TRANSAKSI, RIWAYAT & EDIT KE KERANJANG + UANG PEMBELI
    // =========================================================================
    window.prosesBayar = async (cetakStruk) => {
      if (cart.length === 0) return showToast("Keranjang masih kosong!");
      const total = getCartTotal();
      const bayar = parseRibuan(inputBayar.value);
      if (bayar < total) return showToast("Uang pembeli kurang atau belum diisi!");
      const kembali = bayar - total;

      const now = Date.now();
      const trxId = editingTrxId || ("trx_" + now);
      const code = editingTrxId
        ? (document.getElementById("editingTrxCode").innerText || trxId.slice(-6))
        : String(now).slice(-6);

      const trxData = {
        id: trxId,
        code,
        items: cart.map(i => ({ ...i })),
        total,
        paid: bayar,
        change: kembali,
        createdAt: editingTrxId ? ((await dbLocal.transactions.get(trxId))?.createdAt || now) : now,
        updatedAt: now
      };

      await dbLocal.transactions.put(trxData);
      try {
        await setDoc(doc(dbCloud, "transactions", trxId), trxData, { merge: true });
      } catch (e) {
        console.warn("Simpan lokal sukses, sinkron cloud menyusul:", e);
      }

      if (cetakStruk) {
        const namaToko = localStorage.getItem("storeName") || "TOKO KASIR REALTIME";
        const alamatToko = localStorage.getItem("storeAddr") || "Terima Kasih Atas Kunjungan Anda";
        const waktu = new Date().toLocaleString("id-ID");

        let struk = `${namaToko}\n${alamatToko}\nNo: #${code} | ${waktu}\n--------------------------------\n`;
        cart.forEach(item => {
          const labelUnit = item.unitType === "karton" ? "[KARTON]" : "[ECER]";
          struk += `${item.name} ${labelUnit}\n`;
          struk += `${item.qty} x ${formatRibuan(item.price)} = ${formatRibuan(item.qty * item.price)}\n`;
        });
        struk += `--------------------------------\n`;
        struk += `TOTAL   : Rp ${formatRibuan(total)}\n`;
        struk += `BAYAR   : Rp ${formatRibuan(bayar)}\n`;
        struk += `KEMBALI : Rp ${formatRibuan(kembali)}\n`;
        struk += `--------------------------------\nTerima Kasih\n\n\n`;

        window.location.href = "rawbt:" + encodeURIComponent(struk);
      }

      showToast(editingTrxId ? "Transaksi berhasil diperbarui!" : "Transaksi tersimpan!");
      clearCart();
      renderTransactions();
    };

    async function renderTransactions() {
      const all = await dbLocal.transactions.orderBy("updatedAt").reverse().toArray();
      document.getElementById("totalTrxCount").innerText = all.length;
      const listEl = document.getElementById("transactionList");

      if (all.length === 0) {
        listEl.innerHTML = `<p style="text-align:center; color:var(--muted); padding:16px;">Belum ada transaksi</p>`;
        return;
      }

      listEl.innerHTML = all.slice(0, 50).map(trx => {
        const ringkas = (trx.items || []).map(i => `${i.name} (${i.qty} ${i.unitType === "karton" ? "Ktn" : "Ecr"})`).join(", ");
        return `
          <div class="trx-row">
            <div>
              <strong>#${trx.code}</strong> • <small style="color:var(--muted)">${new Date(trx.createdAt || trx.updatedAt).toLocaleString("id-ID")}</small><br>
              <small style="color:var(--muted)">${ringkas}</small><br>
              <small>
                Total: <b style="color:var(--primary)">Rp ${formatRibuan(trx.total)}</b> |
                Bayar: <b>Rp ${formatRibuan(trx.paid)}</b> |
                Kembali: <b style="color:var(--success)">Rp ${formatRibuan(trx.change)}</b>
              </small>
            </div>
            <button class="btn btn-warning btn-sm" onclick="editTransaction('${trx.id}')">✏️ Edit</button>
          </div>
        `;
      }).join("");
    }

    // Muat kembali transaksi ke keranjang belanja beserta uang pembeli
    window.editTransaction = async (trxId) => {
      const trx = await dbLocal.transactions.get(trxId);
      if (!trx) return showToast("Data transaksi tidak ditemukan");

      cart = (trx.items || []).map((item, idx) => ({
        uid: item.uid || (item.productId + "_" + idx + "_" + Date.now()),
        productId: item.productId,
        name: item.name,
        note: item.note || "",
        unitType: item.unitType || "ecer",
        price: Number(item.price || 0),
        priceEcer: Number(item.priceEcer || item.price || 0),
        priceKarton: Number(item.priceKarton || 0),
        qty: Number(item.qty || 1)
      }));

      editingTrxId = trx.id;
      document.getElementById("editingTrxCode").innerText = trx.code;
      document.getElementById("editTrxBanner").classList.remove("hidden");

      // Isi kembali uang pembeli
      const paidNum = Number(trx.paid || 0);
      inputBayar.value = paidNum > 0 ? formatRibuan(paidNum) : "";

      renderCart();
      switchTab("kasir");
      showToast(`Transaksi #${trx.code} dimuat ke keranjang beserta uang bayar`);
    };

    // =========================================================================
    // 6. KELOLA PRODUK (MULTI-BARCODE OPSIONAL, HARGA BELI OPSIONAL, CATATAN)
    // =========================================================================
    ["prodPriceEcer", "prodPriceKarton", "prodBuyPrice"].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener("input", () => {
        const raw = parseRibuan(el.value);
        el.value = raw > 0 ? formatRibuan(raw) : "";
      });
    });

    document.getElementById("productForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const existingId = document.getElementById("prodDocId").value.trim();
      const name = document.getElementById("prodName").value.trim();
      const barcodes = parseBarcodeList(document.getElementById("prodBarcodes").value);
      const priceEcer = parseRibuan(document.getElementById("prodPriceEcer").value);
      const priceKarton = parseRibuan(document.getElementById("prodPriceKarton").value); // Opsional
      const buyPrice = parseRibuan(document.getElementById("prodBuyPrice").value); // Opsional
      const note = document.getElementById("prodNote").value.trim(); // Opsional

      if (!name || priceEcer <= 0) {
        return showToast("Nama produk dan Harga Eceran wajib diisi!");
      }

      const docId = existingId || (barcodes[0] ? "bc_" + barcodes[0] : "prod_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6));

      const payload = {
        id: docId,
        name,
        barcodes,
        priceEcer,
        priceKarton,
        buyPrice,
        note,
        updatedAt: Date.now()
      };

      try {
        await setDoc(doc(dbCloud, "products", docId), payload, { merge: true });
        await dbLocal.products.put(payload);
        showToast("Produk tersimpan & tersinkron realtime!");
        resetProductForm();
        renderProductList();
      } catch (err) {
        alert("Gagal menyimpan ke Firebase:\n" + err.message);
      }
    });

    window.resetProductForm = () => {
      document.getElementById("productForm").reset();
      document.getElementById("prodDocId").value = "";
    };

    window.editProduct = async (id) => {
      const p = await dbLocal.products.get(id);
      if (!p) return;
      document.getElementById("prodDocId").value = p.id;
      document.getElementById("prodName").value = p.name || "";
      document.getElementById("prodBarcodes").value = Array.isArray(p.barcodes) ? p.barcodes.join(", ") : "";
      document.getElementById("prodPriceEcer").value = p.priceEcer ? formatRibuan(p.priceEcer) : "";
      document.getElementById("prodPriceKarton").value = p.priceKarton ? formatRibuan(p.priceKarton) : "";
      document.getElementById("prodBuyPrice").value = p.buyPrice ? formatRibuan(p.buyPrice) : "";
      document.getElementById("prodNote").value = p.note || "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.deleteProduct = async (id) => {
      if (!confirm("Hapus produk ini dari semua perangkat?")) return;
      await deleteDoc(doc(dbCloud, "products", id));
      await dbLocal.products.delete(id);
      renderProductList();
      showToast("Produk dihapus");
    };

    document.getElementById("filterProdInput").addEventListener("input", renderProductList);

    async function renderProductList() {
      const kw = document.getElementById("filterProdInput").value.trim().toLowerCase();
      const all = await dbLocal.products.toArray();
      document.getElementById("totalProdCount").innerText = all.length;

      const filtered = kw
        ? all.filter(p =>
            p.name.toLowerCase().includes(kw) ||
            (p.note && p.note.toLowerCase().includes(kw)) ||
            (Array.isArray(p.barcodes) && p.barcodes.some(b => b.toLowerCase().includes(kw)))
          )
        : all;

      const listEl = document.getElementById("productList");
      listEl.innerHTML = filtered.slice(0, 60).map(p => {
        const bcText = Array.isArray(p.barcodes) && p.barcodes.length > 0 ? p.barcodes.join(", ") : "Tanpa Barcode";
        return `
          <div class="product-row">
            <div>
              <strong>${p.name}</strong>
              ${p.note ? `<span class="badge-tag">${p.note}</span>` : ""}<br>
              <small style="color:var(--muted)">Barcode: ${bcText}</small><br>
              <small>
                🛒 Ecer: <b style="color:var(--primary)">Rp ${formatRibuan(p.priceEcer)}</b>
                ${p.priceKarton > 0 ? `| 📦 Karton: <b style="color:var(--warning)">Rp ${formatRibuan(p.priceKarton)}</b>` : ""}
                ${p.buyPrice > 0 ? `| 💰 Beli: <b>Rp ${formatRibuan(p.buyPrice)}</b>` : ""}
              </small>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-outline btn-sm" onclick="editProduct('${p.id}')">Ubah</button>
              <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">Hapus</button>
            </div>
          </div>
        `;
      }).join("") || `<p style="color:var(--muted); text-align:center; padding:12px;">Belum ada produk</p>`;
    }

    // =========================================================================
    // 7. NAVIGASI & PENGATURAN
    // =========================================================================
    window.switchTab = (tabName) => {
      ["kasir", "produk", "riwayat", "pengaturan"].forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== tabName);
      });
      const names = ["kasir", "produk", "riwayat", "pengaturan"];
      document.querySelectorAll(".tab-btn").forEach((btn, i) => {
        btn.classList.toggle("active", names[i] === tabName);
      });
      if (tabName === "produk") renderProductList();
      if (tabName === "riwayat") renderTransactions();
      if (tabName === "kasir") searchInput.focus();
    };

    window.saveStoreSettings = () => {
      localStorage.setItem("storeName", document.getElementById("storeNameInput").value.trim());
      localStorage.setItem("storeAddr", document.getElementById("storeAddrInput").value.trim());
      showToast("Pengaturan toko disimpan!");
    };

    window.forceFullResync = async () => {
      if (!confirm("Unduh ulang seluruh data produk & riwayat dari Firebase?")) return;
      localStorage.setItem("lastProdSync", "0");
      localStorage.setItem("lastTrxSync", "0");
      await dbLocal.products.clear();
      await dbLocal.transactions.clear();
      startRealtimeSync();
      showToast("Menyinkronkan ulang data...");
    };

    document.getElementById("storeNameInput").value = localStorage.getItem("storeName") || "";
    document.getElementById("storeAddrInput").value = localStorage.getItem("storeAddr") || "";
    startRealtimeSync();
    renderTransactions();
  </script>
</body>
</html>
