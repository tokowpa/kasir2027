<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POS Variasi & Hutang</title>
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-soft: #ccfbf1;
      --success: #15803d;
      --warning: #c2410c;
      --danger: #b91c1c;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 28px;
      line-height: 1.35;
    }

    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 2000;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow-md);
      display: grid;
      gap: 11px;
    }

    .login-title {
      font-size: 1.1rem;
      font-weight: 800;
      text-align: center;
      color: var(--text);
    }

    .login-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--danger);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      display: none;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 9px 14px;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 120;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 0.96rem;
      font-weight: 800;
      color: var(--text);
    }

    .checkout-panel {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
    }

    .checkout-fields {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      flex: 1;
    }

    .hc-total-wrap {
      display: flex;
      flex-direction: column;
      min-width: 156px;
      padding: 6px 11px;
      border-radius: 8px;
      background: var(--primary-soft);
      border: 1px solid #99f6e4;
    }

    .hc-label {
      font-size: 0.65rem;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .total-amount {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary-dark);
      line-height: 1.15;
      white-space: nowrap;
    }

    .change-amount {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--success);
    }

    .hc-field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .pay-input {
      width: 135px;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: var(--surface-soft);
      color: var(--text) !important;
      caret-color: var(--primary);
      font-size: 0.92rem;
      font-weight: 800;
      text-align: right;
    }

    .hc-suggest-wrap {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 240px;
    }

    .suggest-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .suggest-btn {
      border: 1px solid #cbd5e1;
      background: var(--surface);
      color: var(--text);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 6px;
      cursor: pointer;
    }

    .suggest-btn:hover {
      background: var(--primary-soft);
      border-color: #5eead4;
    }

    .buyer-input {
      width: 155px;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: var(--surface-soft);
      color: var(--text) !important;
      caret-color: var(--primary);
      font-size: 0.84rem;
      font-weight: 600;
    }

    .checkout-actions-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: 18px;
    }

    @media (max-width: 768px) {
      .pay-input, .buyer-input, .hc-suggest-wrap {
        width: 100%;
        max-width: 100%;
      }
      .checkout-actions-group {
        margin-left: 0;
        width: 100%;
      }
      .checkout-actions-group .btn {
        flex: 1;
      }
    }

    .menu-wrapper {
      position: relative;
    }

    .hamburger-btn {
      width: 38px;
      height: 38px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .hamburger-btn:hover {
      background: var(--surface-soft);
    }

    .nav-dropdown {
      position: absolute;
      right: 0;
      top: 44px;
      min-width: 155px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 300;
    }

    .nav-dropdown.open {
      display: flex;
    }

    .nav-item-btn {
      width: 100%;
      border: none;
      background: transparent;
      padding: 8px 10px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.84rem;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .nav-item-btn:hover {
      background: var(--surface-soft);
    }

    .nav-item-btn.active {
      background: var(--primary);
      color: #ffffff;
    }

    .container {
      max-width: 1200px;
      margin: 12px auto;
      padding: 0 12px;
    }

    .kasir-layout {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 12px;
      align-items: start;
    }

    .kasir-left-col {
      order: 1;
    }

    .kasir-right-col {
      order: 2;
    }

    @media (max-width: 768px) {
      .kasir-layout {
        grid-template-columns: 1fr;
      }
      .kasir-left-col {
        order: 2;
      }
      .kasir-right-col {
        order: 1;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
    }

    .kasir-layout .card {
      margin-bottom: 0;
    }

    .edit-banner {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      padding: 7px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
    }

    input[type="text"], input[type="number"], input[type="email"], input[type="password"], textarea, select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.86rem;
      outline: none;
      background: var(--surface-soft);
      color: var(--text);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      background: var(--surface);
    }

    label.field-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .btn {
      border: 1px solid transparent;
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: var(--surface);
      color: var(--text);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn-warning {
      background: var(--warning);
      color: #ffffff;
    }

    .btn-danger {
      background: var(--danger);
      color: #ffffff;
    }

    .btn-outline {
      background: var(--surface);
      border-color: #cbd5e1;
      color: var(--text);
    }

    .btn-outline:hover:not(:disabled) {
      background: var(--surface-soft);
    }

    .btn-sm {
      padding: 5px 9px;
      font-size: 0.74rem;
      border-radius: 6px;
    }

    .search-wrapper {
      position: relative;
    }

    .search-loader {
      font-size: 0.74rem;
      color: var(--primary);
      font-weight: 700;
      margin-top: 4px;
      display: none;
    }

    .search-results {
      margin-top: 7px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 420px;
      overflow-y: auto;
      padding: 4px 6px;
      display: none;
    }

    .search-item {
      padding: 6px 7px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      gap: 8px;
      font-size: 0.84rem;
      border-radius: 6px;
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover {
      background: var(--primary-soft);
    }

    .var-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.64rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      text-transform: uppercase;
      border: 1px solid rgba(15, 23, 42, 0.08);
    }

    .unit-karton { background: #e0f2fe; color: #0369a1; }
    .unit-pcs    { background: #dcfce7; color: #15803d; }
    .unit-renteng{ background: #f3e8ff; color: #7e22ce; }
    .unit-kg     { background: #ffedd5; color: #c2410c; }
    .unit-gram   { background: #ccfbf1; color: #0f766e; }
    .unit-bal    { background: #e0e7ff; color: #4338ca; }
    .unit-slop   { background: #ffe4e6; color: #be123c; }
    .unit-pak    { background: #cffafe; color: #0e7490; }
    .unit-sak    { background: #fef3c7; color: #a16207; }

    .cart-item {
      display: flex;
      flex-direction: column;
      padding: 6px 9px;
      border-radius: 8px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      margin-bottom: 6px;
      gap: 4px;
    }

    .cart-item:last-child {
      margin-bottom: 0;
    }

    .cart-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .cart-title {
      font-weight: 700;
      font-size: 0.84rem;
    }

    .cart-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid #cbd5e1;
      padding: 2px 5px;
      border-radius: 7px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      border: 1px solid #cbd5e1;
      background: var(--surface-soft);
      color: var(--text);
      font-weight: 800;
      font-size: 0.95rem;
      line-height: 1;
      cursor: pointer;
    }

    .qty-value {
      min-width: 18px;
      text-align: center;
      font-size: 0.84rem;
      font-weight: 800;
    }

    .prod-top-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
    }

    .prod-name-box {
      flex: 1 1 180px;
      max-width: 300px;
    }

    .prod-form-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .variant-builder {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: grid;
      gap: 6px;
    }

    .variant-row {
      display: grid;
      grid-template-columns: 105px 115px 150px auto;
      gap: 6px;
      align-items: center;
      padding: 6px;
      border-radius: 7px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    @media (max-width: 600px) {
      .variant-row {
        grid-template-columns: 95px 105px auto;
      }
      .variant-row .v-barcodes {
        grid-column: span 2;
      }
    }

    .product-row, .trx-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .product-row:last-child, .trx-row:last-child {
      border-bottom: none;
    }

    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .var-badges-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 3px;
    }

    .badge-lunas {
      background: #dcfce7;
      color: #15803d;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .badge-hutang {
      background: #fee2e2;
      color: #b91c1c;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      z-index: 999;
      display: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <div id="loginOverlay" class="login-overlay">
    <form id="loginForm" class="login-card">
      <div class="login-title">Masuk Kasir</div>
      <div id="loginError" class="login-error"></div>
      <div>
        <label class="field-label">Email</label>
        <input type="email" id="loginEmail" required autocomplete="email">
      </div>
      <div>
        <label class="field-label">Sandi</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary" style="width:100%;">Masuk</button>
    </form>
  </div>

  <!-- ================= APLIKASI UTAMA ================= -->
  <div id="mainApp" class="hidden">
    <header>
      <div class="brand-title" id="activeTabTitle">Kasir</div>

      <div class="menu-wrapper" id="menuWrapper">
        <button type="button" class="hamburger-btn" id="hamburgerBtn" onclick="toggleNavMenu(event)" title="Menu">☰</button>
        <div class="nav-dropdown" id="navDropdown">
          <button class="nav-item-btn active" data-tab="kasir" onclick="switchTab('kasir')">Kasir</button>
          <button class="nav-item-btn" data-tab="produk" onclick="switchTab('produk')">Produk</button>
          <button class="nav-item-btn" data-tab="riwayat" onclick="switchTab('riwayat')">Riwayat</button>
          <button class="nav-item-btn" data-tab="pengaturan" onclick="switchTab('pengaturan')">Pengaturan</button>
        </div>
      </div>
    </header>

    <div class="container">
      <!-- ================= TAB 1: KASIR ================= -->
      <div id="tab-kasir">
        <div id="editTrxBanner" class="edit-banner hidden">
          <span>Edit #<strong id="editingTrxCode"></strong></span>
          <button class="btn btn-outline btn-sm" onclick="cancelEditTransaction()">Batal</button>
        </div>

        <!-- Panel Checkout Khusus di Menu Kasir -->
        <div class="card checkout-panel">
          <div class="checkout-fields">
            <div class="hc-total-wrap">
              <span class="hc-label">Total Belanja</span>
              <div class="total-amount" id="displayTotal">Rp 0</div>
              <div class="change-amount" id="displayChange">Kembalian: Rp 0</div>
            </div>

            <div class="hc-field">
              <span class="hc-label">Uang Pembeli</span>
              <input type="text" id="inputBayar" class="pay-input" inputmode="numeric" placeholder="0" autocomplete="off">
            </div>

            <div class="hc-suggest-wrap">
              <span class="hc-label">Rekomendasi Uang</span>
              <div id="suggestMoneyButtons" class="suggest-chips">-</div>
            </div>

            <div class="hc-field">
              <span class="hc-label">Nama Pembeli</span>
              <input type="text" id="inputBuyerName" class="buyer-input" placeholder="Opsional" autocomplete="off">
            </div>
          </div>

          <div class="checkout-actions-group">
            <button type="button" class="btn btn-danger" onclick="clearCart()">Reset</button>
            <button type="button" class="btn btn-primary" onclick="prosesBayar(true)">Cetak Nota</button>
          </div>
        </div>

        <div class="kasir-layout">
          <div class="kasir-left-col">
            <div class="card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <strong style="font-size:0.86rem;">Keranjang (<span id="cartCount">0</span>)</strong>
              </div>
              <div id="cartList">
                <p style="text-align:center; color:var(--muted); padding:16px 0; font-size:0.84rem;">Keranjang kosong</p>
              </div>
            </div>
          </div>

          <div class="kasir-right-col">
            <div class="card">
              <label class="field-label">Cari / Barcode Produk</label>
              <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Scan barcode atau ketik nama..." autocomplete="off" autofocus>
                <div id="kasirSearchLoader" class="search-loader">Mencari...</div>
                <div id="searchResults" class="search-results"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= TAB 2: KELOLA PRODUK ================= -->
      <div id="tab-produk" class="hidden">
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <strong id="productFormTitle" style="font-size:0.9rem;">Tambah Produk</strong>
            <button type="button" id="toggleExtraBtn" class="btn btn-outline btn-sm" onclick="toggleExtraFields()">
              + Detail
            </button>
          </div>

          <form id="productForm" style="display:grid; gap:9px;">
            <input type="hidden" id="prodDocId">

            <div class="prod-top-row">
              <div class="prod-name-box">
                <label class="field-label">Nama Produk</label>
                <input type="text" id="prodName" placeholder="Nama produk" required>
              </div>

              <div class="prod-form-actions">
                <button type="submit" class="btn btn-primary btn-sm">Simpan</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="resetProductForm()">Batal</button>
              </div>
            </div>

            <div class="variant-builder">
              <div id="variantRowsContainer" style="display:grid; gap:6px;"></div>
            </div>

            <div id="extraFieldsBox" class="hidden" style="display:grid; grid-template-columns:1fr 1.5fr; gap:8px;">
              <div>
                <label class="field-label">Harga Beli</label>
                <input type="text" id="prodBuyPrice" inputmode="numeric" placeholder="0">
              </div>
              <div>
                <label class="field-label">Catatan</label>
                <input type="text" id="prodNote" placeholder="Opsional">
              </div>
            </div>

            <div class="prod-form-actions">
              <button type="button" class="btn btn-outline btn-sm" onclick="addVariantRow()">+ Variasi</button>
            </div>
          </form>
        </div>

        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <strong style="font-size:0.88rem;">Cari Produk (<span id="totalProdCount">0</span>)</strong>
            <input type="text" id="filterProdInput" placeholder="Ketik untuk mencari produk..." style="max-width:250px; padding:6px 10px;">
          </div>
          <div id="prodSearchLoader" class="search-loader">Mencari...</div>
          <div id="productList"></div>
        </div>
      </div>

      <!-- ================= TAB 3: RIWAYAT TRANSAKSI ================= -->
      <div id="tab-riwayat" class="hidden">
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap;">
            <strong style="font-size:0.88rem;">Riwayat (<span id="totalTrxCount">0</span>)</strong>
            <input type="text" id="filterTrxInput" placeholder="Cari nama / no / barang..." style="max-width:250px; padding:6px 10px;">
          </div>
          <div id="trxSearchLoader" class="search-loader">Mencari...</div>
          <div id="transactionList"></div>
          <div id="trxPaginationBar" class="pagination-bar hidden">
            <button id="prevPageBtn" class="btn btn-outline btn-sm" onclick="changeTrxPage(-1)">Sebelumnya</button>
            <span id="pageInfoText" style="font-size:0.78rem; font-weight:700; color:var(--muted);"></span>
            <button id="nextPageBtn" class="btn btn-outline btn-sm" onclick="changeTrxPage(1)">Berikutnya</button>
          </div>
        </div>
      </div>

      <!-- ================= TAB 4: PENGATURAN ================= -->

  <div id="toast" class="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCiDlnl6AiHWsbJOpG0MHc8sTCn_MebTqI",
  authDomain: "wpastore-1d2c3.firebaseapp.com",
  databaseURL: "https://wpastore-1d2c3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "wpastore-1d2c3",
  storageBucket: "wpastore-1d2c3.firebasestorage.app",

    const app = initializeApp(firebaseConfig);

    const loginOverlay = document.getElementById("loginOverlay");

    onAuthStateChanged(auth, (user) => {
      if (user) {

    let audioCtx = null;

    function getAudioCtx() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    function playTone(freq, startOffset, duration, type = "square", peakGain = 0.85) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime + startOffset;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const comp = ctx.createDynamicsCompressor();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(peakGain, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      comp.threshold.setValueAtTime(-6, now);
      comp.knee.setValueAtTime(12, now);
      comp.ratio.setValueAtTime(6, now);

      osc.connect(gain);
      gain.connect(comp);
      comp.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playScanSuccessSound() {
      playTone(1320, 0, 0.08, "square", 0.85);
      playTone(1980, 0.085, 0.13, "square", 0.9);
    }

    function playScanNotFoundSound() {
      playTone(320, 0, 0.14, "sawtooth", 0.95);
      playTone(220, 0.15, 0.22, "sawtooth", 0.95);
    }

    document.addEventListener("pointerdown", () => getAudioCtx(), { once: true });
    document.addEventListener("keydown", () => getAudioCtx(), { once: true });

    window.toggleNavMenu = (e) => {
      e.stopPropagation();
      document.getElementById("navDropdown").classList.toggle("open");
    };

    document.addEventListener("click", (e) => {
      const wrapper = document.getElementById("menuWrapper");
      if (wrapper && !wrapper.contains(e.target)) {
        document.getElementById("navDropdown").classList.remove("open");
      }
    });

    const VARIANT_UNITS = [
      { key: "karton",  label: "Karton",  cls: "unit-karton" },
      { key: "pcs",     label: "Pcs",     cls: "unit-pcs" },
      { key: "renteng", label: "Renteng", cls: "unit-renteng" },
      { key: "kg",      label: "Kg",      cls: "unit-kg" },
      { key: "gram",    label: "Gram",    cls: "unit-gram" },
      { key: "bal",     label: "Bal",     cls: "unit-bal" },
      { key: "slop",    label: "Slop",    cls: "unit-slop" },
      { key: "pak",     label: "Pak",     cls: "unit-pak" },
      { key: "sak",     label: "Sak",     cls: "unit-sak" }
    ];

    function getUnitMeta(unitKey) {
      return VARIANT_UNITS.find(u => u.key === unitKey) || VARIANT_UNITS[1];
    }

    const dbLocal = new Dexie("KasirRealtimeV16SimpleDB");
    dbLocal.version(1).stores({
      products: "id, name, *allBarcodes, note, updatedAt",
      transactions: "id, code, buyerName, status, total, paid, debt, change, createdAt, updatedAt"
    });

    let cart = [];
    let editingTrxId = null;
    let currentTrxPage = 1;
    const TRX_PER_PAGE = 50;
    let kasirSearchTimer = null;
    let prodSearchTimer = null;
    let trxSearchTimer = null;
    let unsubProducts = null;
    let unsubTransactions = null;

    const formatRibuan = (num) => Number(num || 0).toLocaleString("id-ID");
    const parseRibuan = (str) => Number(String(str || "").replace(/\D/g, "")) || 0;

    function formatDateTimeNoSeconds(ts) {
      const d = new Date(ts || Date.now());
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function centerText(text, width) {
      const str = String(text || "");
      if (str.length >= width) return str;
      return " ".repeat(Math.floor((width - str.length) / 2)) + str;
    }

    function alignRightLine(leftLabel, rightValue, width) {
      const l = String(leftLabel || "");
      const r = String(rightValue || "");
      if (l.length + r.length + 1 > width) {
        return l.slice(0, Math.max(1, width - r.length - 1)) + " " + r;
      }
      return l + " ".repeat(width - l.length - r.length) + r;
    }

    function parseBarcodes(raw) {
      if (Array.isArray(raw)) return [...new Set(raw.map(x => String(x).trim()).filter(Boolean))];
      if (!raw) return [];
      return [...new Set(String(raw).split(/[\n,]+/).map(x => x.trim()).filter(Boolean))];
    }

    function normalizeProduct(docId, data) {
      let variants = Array.isArray(data.variants) ? data.variants : [];
      if (variants.length === 0 && (data.priceEcer || data.priceKarton)) {
        if (data.priceEcer) variants.push({ unit: "pcs", price: Number(data.priceEcer), barcodes: parseBarcodes(data.barcodes) });
        if (data.priceKarton) variants.push({ unit: "karton", price: Number(data.priceKarton), barcodes: [] });
      }
      variants = variants.map(v => ({
        unit: v.unit || "pcs",
        price: Number(v.price || 0),
        barcodes: parseBarcodes(v.barcodes)
      }));
      const allBarcodes = [...new Set(variants.flatMap(v => v.barcodes))];

      return {
        id: docId,
        name: data.name || "",
        variants,
        allBarcodes,
        buyPrice: Number(data.buyPrice || 0),
        note: data.note || "",
        updatedAt: Number(data.updatedAt || Date.now())
      };
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.style.display = "block";
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.display = "none"; }, 2200);
    }

    function stopRealtimeSync() {
      if (unsubProducts) { unsubProducts(); unsubProducts = null; }
      if (unsubTransactions) { unsubTransactions(); unsubTransactions = null; }
    }

    function startRealtimeSync() {
      stopRealtimeSync();

      const lastProdSync = Number(localStorage.getItem("lastProdSync")) || 0;
      const qProd = query(collection(dbCloud, "products"), where("updatedAt", ">", lastProdSync));

      unsubProducts = onSnapshot(qProd, async (snapshot) => {
        let maxTime = lastProdSync;
        const itemsToPut = [];

        snapshot.docChanges().forEach((change) => {
          const item = normalizeProduct(change.doc.id, change.doc.data());
          if (change.type === "added" || change.type === "modified") {
            itemsToPut.push(item);
            if (item.updatedAt > maxTime) maxTime = item.updatedAt;

            cart.forEach(c => {
              if (c.productId === item.id) {
                c.name = item.name;
                c.note = item.note;
                c.variants = item.variants;
                const matchedVar = item.variants.find(v => v.unit === c.unit) || item.variants[0];
                if (matchedVar) {
                  c.unit = matchedVar.unit;
                  c.price = matchedVar.price;
                }
              }
            });
          }
          if (change.type === "removed") {
            dbLocal.products.delete(change.doc.id);
          }
        });

        if (itemsToPut.length > 0) {
          await dbLocal.products.bulkPut(itemsToPut);
          localStorage.setItem("lastProdSync", maxTime);
          renderCart();
          if (document.getElementById("filterProdInput").value.trim()) {
            renderProductList();
          }
          if (lastProdSync > 0) showToast(`${itemsToPut.length} produk tersinkron`);
        }
      }, () => showToast("Mode offline"));

      const lastTrxSync = Number(localStorage.getItem("lastTrxSync")) || 0;
      const qTrx = query(collection(dbCloud, "transactions"), where("updatedAt", ">", lastTrxSync));

      unsubTransactions = onSnapshot(qTrx, async (snapshot) => {
        let maxTrxTime = lastTrxSync;
        const trxToPut = [];

        snapshot.docChanges().forEach((change) => {
          const trx = { id: change.doc.id, ...change.doc.data() };
          if (change.type === "added" || change.type === "modified") {
            trxToPut.push(trx);
            if ((trx.updatedAt || 0) > maxTrxTime) maxTrxTime = trx.updatedAt;
          }
          if (change.type === "removed") {
            dbLocal.transactions.delete(change.doc.id);
          }
        });

        if (trxToPut.length > 0) {
          await dbLocal.transactions.bulkPut(trxToPut);
          localStorage.setItem("lastTrxSync", maxTrxTime);
          renderTransactions();
        }
      }, () => {});
    }

    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");
    const kasirLoader = document.getElementById("kasirSearchLoader");

    searchInput.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        clearTimeout(kasirSearchTimer);
        kasirLoader.style.display = "none";
        const code = searchInput.value.trim();
        if (!code) return;

        const prod = await dbLocal.products.where("allBarcodes").equals(code).first();
        if (prod) {
          const matchedVar = prod.variants.find(v => v.barcodes.includes(code)) || prod.variants[0];
          addToCart(prod, matchedVar ? matchedVar.unit : "pcs");
          playScanSuccessSound();
          searchInput.value = "";
          searchResults.style.display = "none";
        } else {
          playScanNotFoundSound();
          showToast("Barcode tidak ditemukan");
        }
      }
    });

    searchInput.addEventListener("input", () => {
      clearTimeout(kasirSearchTimer);
      const kw = searchInput.value.trim().toLowerCase();
      if (!kw) {
        kasirLoader.style.display = "none";
        searchResults.style.display = "none";
        return;
      }

      kasirLoader.style.display = "block";

      kasirSearchTimer = setTimeout(async () => {
        const matches = await dbLocal.products
          .filter(p =>
            p.name.toLowerCase().includes(kw) ||
            (p.note && p.note.toLowerCase().includes(kw)) ||
            (Array.isArray(p.allBarcodes) && p.allBarcodes.some(b => b.toLowerCase().includes(kw)))
          )
          .limit(30)
          .toArray();

        kasirLoader.style.display = "none";

        if (matches.length === 0) {
          playScanNotFoundSound();
          searchResults.innerHTML = `<div class="search-item" style="color:var(--danger); font-weight:700;">Tidak ditemukan</div>`;
        } else {
          searchResults.innerHTML = matches.map(p => {
            const pills = (p.variants || []).map(v => {
              const meta = getUnitMeta(v.unit);
              return `<span class="var-pill ${meta.cls}">${meta.label}: ${formatRibuan(v.price)}</span>`;
            }).join(" ");
            return `
              <div class="search-item" onclick="selectProduct('${p.id}')">
                <div>
                  <strong>${p.name}</strong>
                  <div class="var-badges-wrap">${pills}</div>
                </div>
              </div>
            `;
          }).join("");
        }
        searchResults.style.display = "block";
      }, 500);
    });

    window.selectProduct = async (id, unitKey = null) => {
      const prod = await dbLocal.products.get(id);
      if (prod) {
        addToCart(prod, unitKey || prod.variants[0]?.unit || "pcs");
        playScanSuccessSound();
        searchInput.value = "";
        searchResults.style.display = "none";
        searchInput.focus();
      }
    };

    function addToCart(product, unitKey) {
      const variant = product.variants.find(v => v.unit === unitKey) || product.variants[0] || { unit: "pcs", price: 0 };
      const existingIdx = cart.findIndex(item => item.productId === product.id && item.unit === variant.unit);

      if (existingIdx !== -1) {
        const [item] = cart.splice(existingIdx, 1);
        item.qty += 1;
        item.price = Number(variant.price || 0);
        item.variants = product.variants;
        cart.unshift(item);
      } else {
        cart.unshift({
          uid: product.id + "_" + variant.unit + "_" + Date.now(),
          productId: product.id,
          name: product.name,
          note: product.note || "",
          unit: variant.unit,
          price: Number(variant.price || 0),
          variants: product.variants,
          qty: 1
        });
      }
      renderCart();
    }

    window.changeCartUnit = async (uid, newUnit) => {
      const idx = cart.findIndex(i => i.uid === uid);
      if (idx === -1) return;

      const item = cart[idx];
      const freshProd = await dbLocal.products.get(item.productId);
      const vars = freshProd?.variants || item.variants || [];
      const targetVar = vars.find(v => v.unit === newUnit);
      if (!targetVar) return showToast("Variasi tidak tersedia");

      item.unit = targetVar.unit;
      item.price = Number(targetVar.price || 0);
      item.variants = vars;

      cart.splice(idx, 1);
      cart.unshift(item);
      playScanSuccessSound();
      renderCart();
    };

    window.updateQty = (uid, delta) => {
      const idx = cart.findIndex(i => i.uid === uid);
      if (idx === -1) return;
      const nextQty = cart[idx].qty + delta;
      if (nextQty < 1) {
        cart[idx].qty = 1;
        showToast("Minimal 1");
      } else {
        cart[idx].qty = nextQty;
      }
      renderCart();
    };

    window.removeCartItem = (uid) => {
      cart = cart.filter(i => i.uid !== uid);
      renderCart();
    };

    window.clearCart = () => {
      cart = [];
      editingTrxId = null;
      document.getElementById("editTrxBanner").classList.add("hidden");
      document.getElementById("inputBayar").value = "";
      document.getElementById("inputBuyerName").value = "";
      renderCart();
      searchInput.focus();
    };

    window.cancelEditTransaction = () => {
      clearCart();
    };

    function getCartTotal() {
      return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    }

    function renderMoneySuggestions(total) {
      const container = document.getElementById("suggestMoneyButtons");
      if (!total || total <= 0) {
        container.innerHTML = "-";
        return;
      }

      const candidates = new Set([total]);
      [5000, 10000, 20000, 50000, 100000].forEach(step => {
        const roundedUp = Math.ceil(total / step) * step;
        if (roundedUp >= total) candidates.add(roundedUp);
      });

      const sorted = [...candidates].sort((a, b) => a - b).slice(0, 4);
      container.innerHTML = sorted.map(amount => {
        const label = amount === total ? `Pas ${formatRibuan(amount)}` : formatRibuan(amount);
        return `<button type="button" class="suggest-btn" onclick="applySuggestedMoney(${amount})">${label}</button>`;
      }).join("");
    }

    window.applySuggestedMoney = (amount) => {
      inputBayar.value = formatRibuan(amount);
      hitungKembalian();
      playScanSuccessSound();
    };

    function renderCart() {
      const listEl = document.getElementById("cartList");
      const total = getCartTotal();
      document.getElementById("displayTotal").innerText = "Rp " + formatRibuan(total);
      document.getElementById("cartCount").innerText = cart.reduce((s, i) => s + i.qty, 0);
      renderMoneySuggestions(total);

      if (cart.length === 0) {
        listEl.innerHTML = `<p style="text-align:center; color:var(--muted); padding:16px 0; font-size:0.84rem;">Keranjang kosong</p>`;
      } else {
        listEl.innerHTML = cart.map(item => {
          const meta = getUnitMeta(item.unit);
          const unitOptions = (item.variants || []).map(v => {
            const uMeta = getUnitMeta(v.unit);
            const selected = v.unit === item.unit ? "selected" : "";
            return `<option value="${v.unit}" ${selected}>${uMeta.label} (${formatRibuan(v.price)})</option>`;
          }).join("");

          return `
            <div class="cart-item">
              <div class="cart-top">
                <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                  <span class="var-pill ${meta.cls}">${meta.label}</span>
                  <span class="cart-title" style="margin-left:4px;">${item.name}</span>
                </div>
                <strong style="font-size:0.84rem; color:var(--text); white-space:nowrap;">Rp ${formatRibuan(item.price * item.qty)}</strong>
              </div>
              <div class="cart-bottom">
                <select onchange="changeCartUnit('${item.uid}', this.value)" style="width:auto; padding:3px 7px; font-size:0.74rem; font-weight:700;">
                  ${unitOptions}
                </select>

                <div class="qty-controls">
                  <button class="qty-btn" onclick="updateQty('${item.uid}', -1)">-</button>
                  <span class="qty-value">${item.qty}</span>
                  <button class="qty-btn" onclick="updateQty('${item.uid}', 1)">+</button>
                </div>

                <button class="btn btn-danger btn-sm" onclick="removeCartItem('${item.uid}')">Hapus</button>
              </div>
            </div>
          `;
        }).join("");
      }
      hitungKembalian();
    }

    const inputBayar = document.getElementById("inputBayar");
    inputBayar.addEventListener("input", () => {
      const raw = parseRibuan(inputBayar.value);
      inputBayar.value = raw > 0 ? formatRibuan(raw) : "";
      hitungKembalian();
    });

    function hitungKembalian() {
      const total = getCartTotal();
      const bayar = parseRibuan(inputBayar.value);
      const selisih = bayar - total;
      const el = document.getElementById("displayChange");

      if (total === 0) {
        el.innerText = "Kembalian: Rp 0";
        el.style.color = "var(--success)";
      } else if (bayar < total) {
        el.innerText = "Hutang: Rp " + formatRibuan(total - bayar);
        el.style.color = "var(--danger)";
      } else {
        el.innerText = "Kembalian: Rp " + formatRibuan(selisih);
        el.style.color = "var(--success)";
      }
    }

    const ESC = "\x1b";
    const GS = "\x1d";
    const CMD_INIT = ESC + "@";
    const CMD_BOLD_ON = ESC + "E" + "\x01";
    const CMD_BOLD_OFF = ESC + "E" + "\x00";
    const CMD_WIDE_ON = GS + "!" + "\x10";
    const CMD_SIZE_NORMAL = GS + "!" + "\x00";
    const CMD_CUT_PARTIAL = GS + "V" + "\x01";

    function buildReceiptText(code, waktu, namaToko, alamatToko, buyerName, status, total, bayar, debt, change) {
      const paperSize = String(localStorage.getItem("paperSize") || "80");
      const width = paperSize === "45" ? 28 : 42;
      const line = "-".repeat(width);

      let struk = CMD_INIT + CMD_BOLD_ON;
      const wideWidth = Math.max(8, Math.floor(width / 2));
      struk += CMD_WIDE_ON + centerText(namaToko.toUpperCase(), wideWidth) + "\n" + CMD_SIZE_NORMAL;
      if (alamatToko) struk += centerText(alamatToko, width) + "\n";

      struk += `${line}\n`;
      struk += `No     : #${code}\n`;
      struk += `Waktu  : ${waktu}\n`;
      struk += `Pembeli: ${buyerName}\n`;
      struk += `Status : ${status}\n`;
      struk += `${line}\n`;

      cart.forEach(item => {
        const uLabel = getUnitMeta(item.unit).label;
        const subtotalStr = formatRibuan(item.qty * item.price);
        struk += `${item.name} (${uLabel})\n`;
        const indent = "      ";
        struk += alignRightLine(`${indent}${item.qty}x ${formatRibuan(item.price)}`, subtotalStr, width) + "\n";
      });

      struk += `${line}\n`;
      struk += alignRightLine("TOTAL", "Rp " + formatRibuan(total), width) + "\n";
      struk += alignRightLine("BAYAR", "Rp " + formatRibuan(bayar), width) + "\n";
      if (status === "HUTANG") {
        struk += alignRightLine("HUTANG", "Rp " + formatRibuan(debt), width) + "\n";
      } else {
        struk += alignRightLine("KEMBALI", "Rp " + formatRibuan(change), width) + "\n";
      }
      struk += `${line}\n`;
      struk += centerText("Terima Kasih", width) + "\n";
      struk += CMD_BOLD_OFF + "\n\n\n" + CMD_CUT_PARTIAL;
      return struk;
    }

    window.prosesBayar = async (cetakStruk) => {
      if (cart.length === 0) return showToast("Keranjang kosong");

      const total = getCartTotal();
      const bayar = parseRibuan(inputBayar.value);
      const buyerName = document.getElementById("inputBuyerName").value.trim() || "Tanpa Nama";

      const isHutang = bayar < total;
      const debt = isHutang ? (total - bayar) : 0;
      const change = isHutang ? 0 : (bayar - total);
      const status = isHutang ? "HUTANG" : "LUNAS";

      const now = Date.now();
      const trxId = editingTrxId || ("trx_" + now);
      const code = editingTrxId
        ? (document.getElementById("editingTrxCode").innerText || trxId.slice(-6))
        : String(now).slice(-6);

      const trxData = {
        id: trxId,
        code,
        buyerName,
        status,
        items: cart.map(i => ({ ...i })),
        total,
        paid: bayar,
        debt,
        change,
        createdAt: editingTrxId ? ((await dbLocal.transactions.get(trxId))?.createdAt || now) : now,
        updatedAt: now
      };

      await dbLocal.transactions.put(trxData);
      setDoc(doc(dbCloud, "transactions", trxId), trxData, { merge: true }).catch(() => {});

      if (cetakStruk) {
        const namaToko = localStorage.getItem("storeName") || "TOKO";
        const alamatToko = localStorage.getItem("storeAddr") || "";
        const struk = buildReceiptText(code, formatDateTimeNoSeconds(now), namaToko, alamatToko, buyerName, status, total, bayar, debt, change);
        window.location.href = "rawbt:" + encodeURIComponent(struk);
      }

      showToast(status === "HUTANG" ? `Hutang Rp ${formatRibuan(debt)}` : "Tersimpan");
      clearCart();
      currentTrxPage = 1;
      renderTransactions();
    };

    const filterTrxInput = document.getElementById("filterTrxInput");
    const trxSearchLoader = document.getElementById("trxSearchLoader");

    filterTrxInput.addEventListener("input", () => {
      clearTimeout(trxSearchTimer);
      trxSearchLoader.style.display = "block";
      trxSearchTimer = setTimeout(async () => {
        currentTrxPage = 1;
        await renderTransactions();
        trxSearchLoader.style.display = "none";
      }, 500);
    });

    window.changeTrxPage = (delta) => {
      currentTrxPage = Math.max(1, currentTrxPage + delta);
      renderTransactions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    async function renderTransactions() {
      const kw = filterTrxInput.value.trim().toLowerCase();
      const all = await dbLocal.transactions.orderBy("updatedAt").reverse().toArray();

      const filtered = kw
        ? all.filter(trx =>
            (trx.buyerName || "").toLowerCase().includes(kw) ||
            String(trx.code || "").toLowerCase().includes(kw) ||
            (trx.status || "").toLowerCase().includes(kw) ||
            (trx.items || []).some(i => (i.name || "").toLowerCase().includes(kw))
          )
        : all;

      const totalFiltered = filtered.length;
      const totalPages = Math.max(1, Math.ceil(totalFiltered / TRX_PER_PAGE));
      if (currentTrxPage > totalPages) currentTrxPage = totalPages;

      document.getElementById("totalTrxCount").innerText = totalFiltered;

      const startIdx = (currentTrxPage - 1) * TRX_PER_PAGE;
      const pageItems = filtered.slice(startIdx, startIdx + TRX_PER_PAGE);
      const listEl = document.getElementById("transactionList");
      const paginationBar = document.getElementById("trxPaginationBar");

      if (totalFiltered === 0) {
        listEl.innerHTML = `<p style="text-align:center; color:var(--muted); padding:14px;">Belum ada transaksi</p>`;
        paginationBar.classList.add("hidden");
        return;
      }

      listEl.innerHTML = pageItems.map(trx => {
        const isHutang = (trx.status === "HUTANG") || (Number(trx.debt || 0) > 0);
        const statusBadge = isHutang
          ? `<span class="badge-hutang">HUTANG Rp ${formatRibuan(trx.debt)}</span>`
          : `<span class="badge-lunas">LUNAS</span>`;

        const ringkas = (trx.items || []).map(i => `${i.name} (${i.qty} ${getUnitMeta(i.unit).label})`).join(", ");

        return `
          <div class="trx-row">
            <div>
              <strong>#${trx.code}</strong> • <strong>${trx.buyerName || "Tanpa Nama"}</strong> ${statusBadge}<br>
              <small style="color:var(--muted)">${formatDateTimeNoSeconds(trx.createdAt || trx.updatedAt)} • ${ringkas}</small><br>
              <small>
                Total: <b>Rp ${formatRibuan(trx.total)}</b> |
                Bayar: <b>Rp ${formatRibuan(trx.paid)}</b> |
                ${isHutang
                  ? `Hutang: <b style="color:var(--danger)">Rp ${formatRibuan(trx.debt)}</b>`
                  : `Kembali: <b style="color:var(--success)">Rp ${formatRibuan(trx.change)}</b>`
                }
              </small>
            </div>
            <button class="btn btn-warning btn-sm" onclick="editTransaction('${trx.id}')">Edit</button>
          </div>
        `;
      }).join("");

      paginationBar.classList.remove("hidden");
      document.getElementById("pageInfoText").innerText = `Hal ${currentTrxPage}/${totalPages}`;
      document.getElementById("prevPageBtn").disabled = currentTrxPage <= 1;
      document.getElementById("nextPageBtn").disabled = currentTrxPage >= totalPages;
    }

    window.editTransaction = async (trxId) => {
      const trx = await dbLocal.transactions.get(trxId);
      if (!trx) return;

      cart = (trx.items || []).map((item, idx) => ({
        uid: item.uid || (item.productId + "_" + idx + "_" + Date.now()),
        productId: item.productId,
        name: item.name,
        note: item.note || "",
        unit: item.unit || "pcs",
        price: Number(item.price || 0),
        variants: item.variants || [{ unit: item.unit || "pcs", price: Number(item.price || 0), barcodes: [] }],
        qty: Math.max(1, Number(item.qty || 1))
      }));

      editingTrxId = trx.id;
      document.getElementById("editingTrxCode").innerText = trx.code;
      document.getElementById("editTrxBanner").classList.remove("hidden");

      const paidNum = Number(trx.paid || 0);
      inputBayar.value = paidNum > 0 ? formatRibuan(paidNum) : "";
      document.getElementById("inputBuyerName").value = trx.buyerName && trx.buyerName !== "Tanpa Nama" ? trx.buyerName : "";

      renderCart();
      switchTab("kasir");
    };

    const productForm = document.getElementById("productForm");
    const variantRowsContainer = document.getElementById("variantRowsContainer");

    productForm.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.target.tagName === "INPUT") {
        e.preventDefault();
        const row = e.target.closest(".variant-row");
        if (row) {
          const inputs = [...row.querySelectorAll("input")];
          const idx = inputs.indexOf(e.target);
          if (idx !== -1 && idx + 1 < inputs.length) inputs[idx + 1].focus();
        }
      }
    });

    window.toggleExtraFields = () => {
      document.getElementById("extraFieldsBox").classList.toggle("hidden");
    };

    window.addVariantRow = (unit = "pcs", price = "", barcodesText = "") => {
      const rowId = "vrow_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
      const optionsHtml = VARIANT_UNITS.map(u =>
        `<option value="${u.key}" ${u.key === unit ? "selected" : ""}>${u.label}</option>`
      ).join("");

      const div = document.createElement("div");
      div.className = "variant-row";
      div.id = rowId;
      div.innerHTML = `
        <select class="v-unit">${optionsHtml}</select>
        <input type="text" class="v-price" inputmode="numeric" placeholder="Harga" value="${price ? formatRibuan(price) : ""}">
        <input type="text" class="v-barcodes" placeholder="Barcode (opsional)" value="${barcodesText}">
        <button type="button" class="btn btn-danger btn-sm" onclick="removeVariantRow('${rowId}')">✕</button>
      `;

      variantRowsContainer.appendChild(div);
      const priceInput = div.querySelector(".v-price");
      priceInput.addEventListener("input", () => {
        const raw = parseRibuan(priceInput.value);
        priceInput.value = raw > 0 ? formatRibuan(raw) : "";
      });
    };

    window.removeVariantRow = (rowId) => {
      if (variantRowsContainer.children.length <= 1) return showToast("Minimal 1 variasi");
      document.getElementById(rowId)?.remove();
    };

    const buyPriceInput = document.getElementById("prodBuyPrice");
    buyPriceInput.addEventListener("input", () => {
      const raw = parseRibuan(buyPriceInput.value);
      buyPriceInput.value = raw > 0 ? formatRibuan(raw) : "";
    });

    productForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const existingId = document.getElementById("prodDocId").value.trim();
      const name = document.getElementById("prodName").value.trim();
      const buyPrice = parseRibuan(buyPriceInput.value);
      const note = document.getElementById("prodNote").value.trim();

      const variants = [];
      variantRowsContainer.querySelectorAll(".variant-row").forEach(row => {
        const unit = row.querySelector(".v-unit").value;
        const price = parseRibuan(row.querySelector(".v-price").value);
        const barcodes = parseBarcodes(row.querySelector(".v-barcodes").value);
        if (price > 0) variants.push({ unit, price, barcodes });
      });

      if (!name || variants.length === 0) return showToast("Lengkapi nama & harga variasi");

      const allBarcodes = [...new Set(variants.flatMap(v => v.barcodes))];
      const docId = existingId || (allBarcodes[0] ? "bc_" + allBarcodes[0] : "prod_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6));

      const payload = { id: docId, name, variants, allBarcodes, buyPrice, note, updatedAt: Date.now() };

      try {
        await setDoc(doc(dbCloud, "products", docId), payload, { merge: true });
        await dbLocal.products.put(payload);
        playScanSuccessSound();
        showToast("Tersimpan");
        resetProductForm();
        if (document.getElementById("filterProdInput").value.trim()) {
          renderProductList();
        }
      } catch (err) {
        alert("Gagal menyimpan:\n" + err.message);
      }
    });

    window.resetProductForm = () => {
      productForm.reset();
      document.getElementById("prodDocId").value = "";
      document.getElementById("productFormTitle").innerText = "Tambah Produk";
      document.getElementById("extraFieldsBox").classList.add("hidden");
      variantRowsContainer.innerHTML = "";
      addVariantRow("pcs");
    };

    window.editProduct = async (id) => {
      const p = await dbLocal.products.get(id);
      if (!p) return;
      document.getElementById("prodDocId").value = p.id;
      document.getElementById("prodName").value = p.name || "";
      document.getElementById("productFormTitle").innerText = "Ubah Produk";
      document.getElementById("extraFieldsBox").classList.remove("hidden");
      buyPriceInput.value = p.buyPrice ? formatRibuan(p.buyPrice) : "";
      document.getElementById("prodNote").value = p.note || "";

      variantRowsContainer.innerHTML = "";
      const listVar = Array.isArray(p.variants) && p.variants.length > 0 ? p.variants : [{ unit: "pcs", price: 0, barcodes: [] }];
      listVar.forEach(v => addVariantRow(v.unit, v.price, (v.barcodes || []).join(", ")));
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.deleteProduct = async (id) => {
      if (!confirm("Hapus produk ini?")) return;
      await deleteDoc(doc(dbCloud, "products", id));
      await dbLocal.products.delete(id);
      renderProductList();
      showToast("Dihapus");
    };

    const filterProdInput = document.getElementById("filterProdInput");
    const prodSearchLoader = document.getElementById("prodSearchLoader");

    filterProdInput.addEventListener("input", () => {
      clearTimeout(prodSearchTimer);
      const kw = filterProdInput.value.trim().toLowerCase();
      if (!kw) {
        prodSearchLoader.style.display = "none";
        document.getElementById("productList").innerHTML = "";
        return;
      }
      prodSearchLoader.style.display = "block";
      prodSearchTimer = setTimeout(async () => {
        await renderProductList();
        prodSearchLoader.style.display = "none";
      }, 500);
    });

    async function renderProductList() {
      const kw = filterProdInput.value.trim().toLowerCase();
      const all = await dbLocal.products.toArray();
      document.getElementById("totalProdCount").innerText = all.length;

      const listEl = document.getElementById("productList");
      if (!kw) {
        listEl.innerHTML = "";
        return;
      }

      const filtered = all.filter(p =>
        p.name.toLowerCase().includes(kw) ||
        (p.note && p.note.toLowerCase().includes(kw)) ||
        (Array.isArray(p.allBarcodes) && p.allBarcodes.some(b => b.toLowerCase().includes(kw))) ||
        (Array.isArray(p.variants) && p.variants.some(v => v.unit.toLowerCase().includes(kw)))
      );

      listEl.innerHTML = filtered.slice(0, 60).map(p => {
        const varBadges = (p.variants || []).map(v => {
          const meta = getUnitMeta(v.unit);
          const bcLabel = v.barcodes && v.barcodes.length > 0 ? ` [${v.barcodes.join(", ")}]` : "";
          return `<span class="var-pill ${meta.cls}">${meta.label}: Rp ${formatRibuan(v.price)}${bcLabel}</span>`;
        }).join("");

        return `
          <div class="product-row">
            <div>
              <strong>${p.name}</strong>
              <div class="var-badges-wrap">${varBadges}</div>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-outline btn-sm" onclick="editProduct('${p.id}')">Ubah</button>
              <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">Hapus</button>
            </div>
          </div>
        `;
      }).join("") || `<p style="color:var(--muted); text-align:center; padding:12px;">Tidak ada hasil</p>`;
    }

    const TAB_LABELS = {
      kasir: "Kasir",
      produk: "Produk",
      riwayat: "Riwayat",
      pengaturan: "Pengaturan"
    };

    window.switchTab = async (tabName) => {
      ["kasir", "produk", "riwayat", "pengaturan"].forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== tabName);
      });
      document.getElementById("activeTabTitle").innerText = TAB_LABELS[tabName] || "Kasir";
      document.querySelectorAll(".nav-item-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tabName);
      });
      document.getElementById("navDropdown").classList.remove("open");

      if (tabName === "produk") {
        document.getElementById("totalProdCount").innerText = await dbLocal.products.count();
        if (!filterProdInput.value.trim()) {
          document.getElementById("productList").innerHTML = "";
        }
      }
      if (tabName === "riwayat") renderTransactions();
      if (tabName === "kasir") searchInput.focus();
    };

    window.saveStoreSettings = () => {
      localStorage.setItem("storeName", document.getElementById("storeNameInput").value.trim());
      localStorage.setItem("storeAddr", document.getElementById("storeAddrInput").value.trim());
      localStorage.setItem("paperSize", document.getElementById("paperSizeSelect").value);
      showToast("Pengaturan disimpan");
    };

    window.deleteHistoryExceptDebt = async () => {
      const all = await dbLocal.transactions.toArray();
      const nonDebt = all.filter(trx => !((trx.status === "HUTANG") || (Number(trx.debt || 0) > 0)));
      if (nonDebt.length === 0) return showToast("Tidak ada riwayat lunas");
      if (!confirm(`Hapus ${nonDebt.length} riwayat lunas? Hutang tidak akan dihapus.`)) return;

      for (const trx of nonDebt) {
        await dbLocal.transactions.delete(trx.id);
        deleteDoc(doc(dbCloud, "transactions", trx.id)).catch(() => {});
      }

      currentTrxPage = 1;
      renderTransactions();
      showToast(`${nonDebt.length} riwayat dihapus`);
    };

    window.forceFullResync = async () => {
      if (!confirm("Sinkron ulang semua data dari cloud?")) return;
      localStorage.setItem("lastProdSync", "0");
      localStorage.setItem("lastTrxSync", "0");
      await dbLocal.products.clear();
      await dbLocal.transactions.clear();
      startRealtimeSync();
      showToast("Menyinkronkan...");
    };

    resetProductForm();
    document.getElementById("storeNameInput").value = localStorage.getItem("storeName") || "";
    document.getElementById("storeAddrInput").value = localStorage.getItem("storeAddr") || "";
    document.getElementById("paperSizeSelect").value = localStorage.getItem("paperSize") || "80";
  </script>
</body>
</html>
